<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>.NET Web API & OpenLayers Örneği</title>
    <!-- OpenLayers CSS CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@v10.4.0/ol.css"
    />
    <style>
      #map {
        width: 100%;
        height: 90vh;
      }
    </style>
  </head>
  <body>
    <h2>.NET Web API ve OpenLayers Entegrasyonu</h2>
    <div id="map"></div>

    <!-- OpenLayers JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.4.0/dist/ol.js"></script>
    <script>
      // map.html açıldığında çalışır
      const token = localStorage.getItem("jwt_token");

      if (!token) {
        alert("Bu sayfaya erişmek için giriş yapmalısınız!");
        window.location.href = "/"; // Login sayfasına yönlendir
      }
      // 1. Haritayı Oluşturma
      const map = new ol.Map({
        target: "map",
        layers: [
          // Altlık harita olarak OpenStreetMap kullanıyoruz
          new ol.layer.Tile({
            source: new ol.source.OSM(),
          }),
        ],
        view: new ol.View({
          // Türkiye merkezli başlatıyoruz (WGS84 -> Web Mercator dönüşümü)
          center: ol.proj.fromLonLat([32.80382, 39.96252]),
          zoom: 10,
        }),
      });
    </script>
  </body>
</html>
